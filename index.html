<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="Fahemny" />
    <meta name="application-name" content="Fahemny IGCSE" />
    <meta name="theme-color" content="#0A0E17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Fahemny IGCSE — Cambridge &amp; Edexcel Examination &amp; Revision Suite</title>
    <meta name="description" content="Official Cambridge (CAIE) and Pearson Edexcel IGCSE past papers, mark scheme step-by-step solver, topic classifieds, and syllabus revision." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#111113] text-[#F4F4F5] antialiased font-['Plus_Jakarta_Sans',sans-serif] overscroll-none">
    <div id="root">
      <div id="simply-preloader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;color:#A1A1AA;background:#111113;padding:24px;text-align:center;">
        <div style="width:44px;height:44px;border:3px solid rgba(255,255,255,0.08);border-top-color:#FF5B37;border-right-color:#FFA63A;border-radius:50%;animation:simply-spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;margin-bottom:18px;"></div>
        <div style="font-weight:800;font-size:18px;color:#f8fafc;letter-spacing:-0.02em;">Fahemny IGCSE</div>
        <div id="simply-preloader-hint" style="font-size:12px;margin-top:6px;max-width:320px;color:#64748b;">Loading study workspace...</div>
        <style>@keyframes simply-spin{to{transform:rotate(360deg)}}</style>
        <script>
          setTimeout(function() {
            var hint = document.getElementById('simply-preloader-hint');
            if (hint) {
              hint.innerHTML = '<span style="color:#FFA63A;">Taking longer than expected?</span><br/><button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){for(var r of regs)r.unregister();location.reload(true);});}else{location.reload(true);}" style="margin-top:12px;display:inline-block;padding:9px 18px;background:linear-gradient(135deg,#FF5B37,#FF7A45);color:white;border:none;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 4px 14px rgba(255,91,55,0.35);">Reset Cache & Reload</button>';
            }
          }, 3500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
