<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="simplyOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFA600" />
      <stop offset="50%" stopColor="#FF7A00" />
      <stop offset="100%" stopColor="#FF4B00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" floodColor="#FF4B00" floodOpacity="0.4" />
    </filter>
  </defs>
  <!-- Diamond Cap -->
  <path d="M50 12 L92 30 L50 48 L8 30 Z" fill="#FF7A00" stroke="#FFA600" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Skull Cap Base -->
  <path d="M24 36 V52 C24 64 76 64 76 52 V36" fill="none" stroke="#FF5500" stroke-width="7" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M88 32 V54 L92 60" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />
  <!-- Bold Glowing Orange S -->
  <path d="M68 36 C42 36 28 48 28 60 C28 75 74 68 74 84 C74 96 56 100 38 96 C28 94 22 88 20 82" 
        fill="none" stroke="url(#simplyOrange)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
</svg>